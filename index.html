<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candidate Hotlists</title>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; padding: 12px; color: #1a2533; }
    h3 { margin: 12px 0 6px; font-size: 13px; }
    pre { background: #f4f5f7; border: 1px solid #dde1e7; border-radius: 6px; padding: 10px; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 260px; overflow-y: auto; }
    button { padding: 6px 12px; border: 1px solid #4a90d9; border-radius: 6px; background: #fff; color: #2f6fad; cursor: pointer; font-size: 12px; }
  </style>
  <script src="https://cdn.jsdelivr.net/gh/krakenjs/post-robot@7da06445/dist/post-robot.js"></script>
</head>
<body>
  <h3>TearsheetMember field inspector</h3>
  <button onclick="run()">Reload</button>
  <h3>1. meta/TearsheetMember fields</h3>
  <pre id="meta">running…</pre>
  <h3>2. sample row (no filter)</h3>
  <pre id="sample">waiting…</pre>

<script>
function prSend(name, data) {
  postRobot.CONFIG.LOG_LEVEL = 'debug';
  return postRobot.send(window.parent, name, data || {});
}

var params   = new URLSearchParams(window.location.search);
var entityId = params.get('EntityID');

document.addEventListener('DOMContentLoaded', run);

// Pull the real payload out of whatever post-robot hands back
function unwrap(result) {
  // result may be {data: <bhResponse>} or the bhResponse directly
  var d = result;
  if (result && result.data !== undefined) d = result.data;
  return d;
}

function show(elId, label, result) {
  var payload = unwrap(result);
  var txt;
  try { txt = JSON.stringify(payload, null, 2); } catch(e) { txt = String(payload); }
  if (txt === undefined || txt === '{}' || txt === undefined) txt = '(empty) raw: ' + String(payload);
  document.getElementById(elId).textContent = txt;
}

async function run() {
  document.getElementById('meta').textContent = 'running…';
  document.getElementById('sample').textContent = 'waiting…';

  try { await prSend('register', { name: 'hotlists-card', version: '1.0' }).catch(function(){}); } catch(e) {}

  // 1. Metadata — lists every field on TearsheetMember
  try {
    var meta = await prSend('httpGET', { relativeURL: 'meta/TearsheetMember?fields=*' });
    show('meta', 'meta', meta);
  } catch(err) {
    document.getElementById('meta').textContent = 'META ERROR: ' + extractErr(err);
  }

  // 2. Grab one real row with ALL fields so we see the actual structure
  try {
    var sample = await prSend('httpGET', { relativeURL: 'query/TearsheetMember?where=id>0&fields=*&count=3&start=0' });
    show('sample', 'sample', sample);
  } catch(err) {
    document.getElementById('sample').textContent = 'SAMPLE ERROR: ' + extractErr(err);
  }
}

function extractErr(err) {
  try { if (err && err.message) return err.message; } catch(e) {}
  try { return JSON.stringify(err); } catch(e) {}
  return String(err);
}
</script>
</body>
</html>
